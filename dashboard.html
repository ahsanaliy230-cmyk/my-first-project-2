<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduLearn - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header> <!-- مینو --> </header>
    <main>
        <section class="dashboard">
            <div class="welcome">
                <h2>Welcome, Ahmad!</h2>
                <p>Track your course progress here.</p>
            </div>
            <div class="course-progress">
                <h3>Web Development Bootcamp</h3>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 75%;">75%</div>
                </div>
                <p>Next lesson: JavaScript Basics</p>
            </div>
            <div class="course-progress">
                <h3>Data Science Fundamentals</h3>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 40%;">40%</div>
                </div>
                <p>Next lesson: Python Pandas</p>
            </div>
        </section>
    </main>
    <footer>...</footer>
    <script src="common.js"></script>
  <script>
    // د ژبو بدلونکی
    (function() {
        const langButtons = document.querySelectorAll('.lang-btn');
        const elementsToTranslate = document.querySelectorAll('[data-en]');
        if (langButtons.length === 0 || elementsToTranslate.length === 0) return;

        function setLanguage(lang) {
            elementsToTranslate.forEach(el => {
                const translation = el.getAttribute(`data-${lang}`);
                if (translation) el.textContent = translation;
            });
            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.id === `lang-${lang}`);
            });
            document.documentElement.lang = lang;
        }

        langButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const lang = e.target.id.split('-')[1];
                setLanguage(lang);
            });
        });

        // ابتدائي ژبه (انګلیسي)
        setLanguage('en');
    })();

    // د چیټ بکس فعالیت
    (function() {
        const chatButton = document.getElementById('chat-button');
        const chatBox = document.getElementById('chat-box');
        const closeChat = document.getElementById('close-chat');
        if (chatButton && chatBox && closeChat) {
            chatButton.addEventListener('click', () => {
                chatBox.classList.toggle('active');
            });
            closeChat.addEventListener('click', () => {
                chatBox.classList.remove('active');
            });
        }
    })();

    // د خبر پاڼې پاپ اپ
    (function() {
        const popup = document.getElementById('newsletter-popup');
        if (popup) {
            // د ۳ ثانیو وروسته ښکاره کړئ
            setTimeout(() => {
                popup.classList.add('active');
            }, 3000);

            const closePopup = document.getElementById('close-popup');
            if (closePopup) {
                closePopup.addEventListener('click', () => {
                    popup.classList.remove('active');
                });
            }

            window.addEventListener('click', (e) => {
                if (e.target === popup) {
                    popup.classList.remove('active');
                }
            });
        }
    })();
</script>
</body>
</html>
