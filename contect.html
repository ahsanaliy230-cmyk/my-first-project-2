<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduLearn - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">EduLearn</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Send us a message.</p>
        </section>

        <section class="contact-form">
            <form action="#" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="btn">Send Message</button>
            </form>
        </section>

        <section class="contact-info">
            <h3>Other ways to reach us</h3>
            <p>Email: info@edulearn.com</p>
            <p>Phone: +1 (555) 123-4567</p>
            <p>Address: 123 Learning Lane, Knowledge City, ED 12345</p>
            <!-- Optional map image -->
            <img src="https://source.unsplash.com/featured/600x200?map" alt="Map" style="margin-top: 20px; border-radius: 8px;">
        </section>
    </main>

    <footer>
        <p>&copy; 2025 EduLearn. All rights reserved.</p>
    </footer>
</body>
</html>
